<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de namoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="window">
            <span>Com carinho</span>
        </header>
        <div class="letter">
            <p class="greeting">Oi, meu amor,</p>
            <h1 id="title">Quer namorar comigo?</h1>
            <p>Gosto muito de estar com você e queria tornar isso oficial.</p>
            <div class="cats" aria-label="Fotos de gatinhos">
                <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=320&q=80" alt="Gatinho olhando para a câmera">
                <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=320&q=80" alt="Gatinho branco e laranja">
                <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=320&q=80" alt="Gatinho descansando">
            </div>
            <div class="buttons">
                <button id="yesBtn" type="button">Sim</button>
                <button id="noBtn" type="button">Não</button>
            </div>
        </div>
    </main>
    <script src="java.js"></script>
</body>
</html>
